[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "types-tqdm>=4.70.0.20260906",
]
